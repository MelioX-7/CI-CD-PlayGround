name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest


    permissions:
        contents: read
        packages: write


    steps:
      - name: Checkout code
        uses: actions/checkout@v4



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"



      - name: Install dependencies
        run: python -m pip install fastapi uvicorn pytest httpx2


      - name: Run tests
        run: python -m pytest


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker image
        run: docker build -t ghcr.io/meliox-7/ci-cd-playground:latest .
